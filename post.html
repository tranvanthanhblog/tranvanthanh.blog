<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trần Văn Thành Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  </head>

  <body>
    <div class="feed">
      <button onclick="history.back()" class="btn ghost">← Quay lại</button>

      <h2 id="title"></h2>

      <div id="media" class="post-media"></div>
      <div id="content" class="post-content"></div>
    </div>

    <script src="db.js"></script>

    <script>
      const id = localStorage.getItem("viewPost");

      function renderMedia(url) {
  if (!url) return "";

  if (url.includes("drive.google.com/file/d/")) {
    const id = url.split("/d/")[1].split("/")[0];
    url = `https://drive.google.com/uc?export=download&id=${id}`;
  }

  
  return `<video src="${url}" controls style="width:100%"></video>`;
}

      DB.onPosts((posts) => {
        const post = posts.find((p) => p.id === id);
        if (!post) return;

        title.textContent = post.title;

        media.innerHTML = renderMedia(post.media);

        content.innerHTML = post.content.replace(/\n/g, "<br>");
      });
    </script>
  </body>
</html>
