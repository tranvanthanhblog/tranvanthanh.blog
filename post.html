<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trần Văn Thành Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  </head>

  <body>
    <div class="feed">
      <button onclick="history.back()" class="btn ghost">← Quay lại</button>

      <h2 id="title"></h2>

      <div id="media" class="post-media"></div>
      <div id="content" class="post-content"></div>
    </div>
    <h3>Bình luận</h3>

    <div id="commentBox" class="comment hidden">
     <input id="cmtInput" placeholder="Viết bình luận..." />
     <button id="btnSend" class="btn">Gửi</button>
    </div>
    <div id="commentList"></div>

    
    <script src="db.js"></script>

    <script>
      const id = localStorage.getItem("viewPost");

      function renderMedia(url) {
        if (!url) return "";
        if (url.includes("drive.google.com/file/d/")) {
         const id = url.split("/d/")[1].split("/")[0];
         return `<iframe 
                   src="https://drive.google.com/file/d/${id}/preview"
                   width="100%" 
                   height="480"
                   allow="autoplay">
                </iframe>`;
        }
        if (/\.(jpg|jpeg|png|gif|webp)$/i.test(url)) {
        return `<img src="${url}" />`;
        }
        return `<video src="${url}" controls style="width:100%"></video>`;
      }

      DB.onPosts((posts) => {
        const post = posts.find((p) => p.id === id);
        if (!post) return;

        title.textContent = post.title;

        media.innerHTML = renderMedia(post.media);

        content.innerHTML = post.content.replace(/\n/g, "<br>");
      });
      DB.auth.onAuthStateChanged((user) => {
    currentUser = user;

    if (user) commentBox.classList.remove("hidden");
    else commentBox.classList.add("hidden");
  });

  btnSend.onclick = () => {
    if (!currentUser) return;

    const text = cmtInput.value.trim();
    if (!text) return;

    DB.addComment(id, currentUser, text);
    cmtInput.value = "";
  };

  DB.onComments(id, (comments) => {
    commentList.innerHTML = "";

    comments.forEach((c) => {
      const div = document.createElement("div");
      div.className = "comment";

      div.innerHTML = `
        <img src="${c.photo || "https://i.pravatar.cc/40"}">
        <b>${c.name}</b>
        <span>${c.text}</span>
        ${
          currentUser &&
          (currentUser.uid === c.uid || DB.isAdmin(currentUser))
            ? `<span class="del-cmt">❌</span>`
            : ""
        }
      `;

      const del = div.querySelector(".del-cmt");
      if (del) {
        del.onclick = () => DB.deleteComment(id, c.id);
      }

      commentList.appendChild(div);
    });
  });
    </script>
  </body>
</html>
